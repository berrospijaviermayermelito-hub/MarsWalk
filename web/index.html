<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarsWalk – Jezero EVA Planner</title>

  <!-- Leaflet 1.9 (BSD-2-Clause) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <style>
    /* ── Reset & dark theme ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #111114;
      --surface:  #1a1a1f;
      --border:   #2a2a30;
      --text:     #e0e0e4;
      --muted:    #8888a0;
      --accent:   #4fa0ff;
      --green:    #3ddc84;
      --amber:    #ffb74d;
      --red:      #ef5350;
    }

    html, body { height: 100%; font-family: "Inter", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }

    /* ── Layout ─────────────────────────────────────────────── */
    #app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ────────────────────────────────────────────── */
    #sidebar {
      width: 320px;
      min-width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      overflow-y: auto;
    }

    #sidebar h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    #sidebar h1 span { color: var(--accent); }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-top: 8px;
    }

    /* Status box */
    #status-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    #status-box .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    #status-box .status-row:last-child { margin-bottom: 0; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot.ok     { background: var(--green); }
    .dot.warn   { background: var(--amber); }
    .dot.err    { background: var(--red); }
    .dot.off    { background: var(--muted); }

    /* Traffic light */
    #traffic-light {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    #traffic-light .lights {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    #traffic-light .bulb {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    #traffic-light .bulb.green  { background: var(--green); box-shadow: 0 0 10px var(--green); }
    #traffic-light .bulb.amber  { background: var(--border); }
    #traffic-light .bulb.red    { background: var(--border); }
    #traffic-light .caption {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Error banner */
    #error-banner {
      display: none;
      background: rgba(239, 83, 80, 0.15);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: var(--red);
    }

    /* Route info */
    #route-info {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
    }
    #route-info dt { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
    #route-info dd { margin-bottom: 8px; font-weight: 600; }

    .credit {
      margin-top: auto;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* ── Map ─────────────────────────────────────────────────── */
    #map {
      flex: 1;
      background: var(--bg);
    }

    /* Dark Leaflet overrides */
    .leaflet-control-layers,
    .leaflet-control-zoom a,
    .leaflet-control-attribution {
      background: var(--surface) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }
    .leaflet-control-zoom a { color: var(--text) !important; }
    .leaflet-control-layers-expanded { color: var(--text) !important; }
    .leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); }
    .leaflet-popup-tip { background: var(--surface); }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 700px) {
      #app { flex-direction: column; }
      #sidebar { width: 100%; min-width: 0; max-height: 40vh; }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- ─── Sidebar ──────────────────────────────────────────── -->
  <aside id="sidebar">
    <h1>🔴 <span>Mars</span>Walk</h1>
    <p style="font-size: 0.85rem; color: var(--muted);">Jezero Crater EVA Planner</p>

    <p class="section-label">Map Status</p>
    <div id="status-box">
      <div class="status-row">
        <span class="dot off" id="dot-tiles"></span>
        <span id="lbl-tiles">Loading base tiles…</span>
      </div>
      <div class="status-row">
        <span class="dot off" id="dot-route"></span>
        <span id="lbl-route">Route: not loaded</span>
      </div>
    </div>

    <div id="error-banner"></div>

    <p class="section-label">Conditions</p>
    <div id="traffic-light">
      <div class="lights">
        <div class="bulb green"></div>
        <div class="bulb amber"></div>
        <div class="bulb red"></div>
      </div>
      <p class="caption">Typical conditions for this season and hour</p>
    </div>

    <p class="section-label">Route Summary</p>
    <div id="route-info">
      <dl>
        <dt>Distance</dt>
        <dd id="val-distance">—</dd>
        <dt>Estimated EVA time</dt>
        <dd id="val-time">—</dd>
        <dt>Science stops</dt>
        <dd id="val-stops">—</dd>
      </dl>
    </div>

    <p class="credit">
      Tiles © NASA/Mars Trek · Data: MRO, MGS, Mars 2020, MSL<br />
      Built for NASA Space Apps 2026
    </p>
  </aside>

  <!-- ─── Map container ────────────────────────────────────── -->
  <div id="map"></div>

</div>

<script src="map.js"></script>
</body>
</html>
